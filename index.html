<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vietmap Pro Telegram Mini App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-webapp.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f172a; }
        #map { width: 100%; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; background: #1e293b; }
        .hud-overlay { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1000; pointer-events: none; }
        .hud-interactive { pointer-events: auto; }
        
        /* Mũi tên định vị xoay theo hướng di chuyển giống Vietmap */
        .navigation-arrow {
            width: 36px;
            height: 36px;
            background: #2563eb;
            border: 3px solid #ffffff;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.8);
            transform-origin: center center;
            transition: transform 0.3s ease-out;
        }

        .warning-popup { animation: pulseWarning 1s infinite alternate; }
        @keyframes pulseWarning {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(239, 68, 68, 0.6); }
            100% { transform: scale(1.03); box-shadow: 0 0 25px rgba(239, 68, 68, 0.9); }
        }
    </style>
</head>
<body class="text-white">

    <!-- HUD Giao diện trên cùng -->
    <div class="hud-overlay flex flex-col gap-2">
        <div class="flex justify-between items-center bg-slate-900/90 backdrop-blur-md p-3 rounded-2xl border border-slate-700/80 hud-interactive shadow-xl">
            <!-- Tốc độ hiện tại -->
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white px-3 py-1 rounded-xl text-2xl font-black min-w-[70px] text-center shadow-inner" id="current-speed">0</div>
                <div class="flex flex-col">
                    <span class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Tốc độ xe</span>
                    <span class="text-xs font-semibold text-slate-200">Km/h</span>
                </div>
            </div>
            
            <!-- Biển giới hạn tốc độ chuẩn Vietmap -->
            <div id="speed-limit-sign" class="hidden flex items-center justify-center w-12 h-12 bg-white border-4 border-red-600 rounded-full text-slate-900 font-black text-sm shadow-lg">
                50
            </div>

            <!-- Trạng thái GPS -->
            <div class="flex flex-col items-end">
                <div id="gps-status" class="px-2.5 py-1 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-full text-[10px] font-semibold animate-pulse">
                    Đang tìm GPS...
                </div>
            </div>
        </div>

        <!-- Thanh tìm kiếm địa điểm -->
        <div class="flex gap-2 hud-interactive">
            <input type="text" id="search-input" placeholder="Tìm kiếm địa điểm, tuyến đường..." class="flex-1 bg-slate-900/90 backdrop-blur-md border border-slate-700 px-4 py-2.5 rounded-xl text-sm text-white placeholder-slate-400 focus:outline-none focus:border-blue-500 shadow-md">
            <button onclick="searchLocation()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-xl text-sm font-semibold shadow-md transition-all">
                Tìm
            </button>
        </div>
    </div>

    <!-- Cảnh báo khẩn cấp giữa màn hình -->
    <div id="alert-banner" class="absolute top-36 left-4 right-4 z-[1000] hidden pointer-events-none flex justify-center">
        <div class="warning-popup bg-red-600 text-white px-5 py-3 rounded-2xl shadow-2xl border-2 border-white flex items-center gap-3 max-w-md w-full">
            <svg class="w-8 h-8 shrink-0 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
            <div class="flex flex-col">
                <span class="text-xs uppercase font-bold text-red-100 tracking-wider">Cảnh báo giao thông</span>
                <span id="alert-text" class="text-sm font-extrabold">Phía trước có camera phạt nguội!</span>
            </div>
        </div>
    </div>

    <!-- Thanh công cụ báo cáo cộng đồng dưới màn hình -->
    <div class="absolute bottom-6 left-4 right-4 z-[1000] flex justify-between gap-2 hud-interactive">
        <button onclick="reportIssue('camera')" class="flex-1 bg-slate-800/95 hover:bg-slate-700 backdrop-blur-md border border-slate-700 py-2.5 px-2 rounded-xl text-xs font-semibold shadow-xl text-amber-400 flex items-center justify-center gap-1.5">
            📷 Phạt Nguội
        </button>
        <button onclick="reportIssue('speed')" class="flex-1 bg-slate-800/95 hover:bg-slate-700 backdrop-blur-md border border-slate-700 py-2.5 px-2 rounded-xl text-xs font-semibold shadow-xl text-rose-400 flex items-center justify-center gap-1.5">
            ⚡ Tốc Độ
        </button>
        <button onclick="reportIssue('toll')" class="flex-1 bg-slate-800/95 hover:bg-slate-700 backdrop-blur-md border border-slate-700 py-2.5 px-2 rounded-xl text-xs font-semibold shadow-xl text-emerald-400 flex items-center justify-center gap-1.5">
            💰 Trạm Thu Phí
        </button>
    </div>

    <!-- Bản đồ Leaflet -->
    <div id="map"></div>

    <script>
        // 1. Khởi tạo Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor('#0f172a');

        // Tọa độ mặc định (Thành phố Vinh, Nghệ An)
        const defaultCenter = [18.6796, 105.6828];

        // Khởi tạo bản đồ Leaflet
        const map = L.map('map', { zoomControl: false }).setView(defaultCenter, 15);

        // Sử dụng nền bản đồ tối CartoDB Dark Matter (phong cách lái xe ban đêm cực đẹp)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            subdomains: 'abcd',
            attribution: '&copy; OpenStreetMap contributors & CARTO'
        }).addTo(map);

        // 2. Cơ sở dữ liệu cảnh báo giao thông phong cách Vietmap Pro (Mở rộng tại Vinh & các tuyến chính)
        let warningDatabase = [
            { id: 1, lat: 18.6820, lng: 105.6850, type: 'camera', title: 'Camera phạt nguội vượt đèn đỏ', speedLimit: 50 },
            { id: 2, lat: 18.6750, lng: 105.6780, type: 'speed', title: 'Khu vực bắn tốc độ / Giới hạn', speedLimit: 40 },
            { id: 3, lat: 18.6700, lng: 105.6900, type: 'camera', title: 'Camera phạt nguội rẽ trái', speedLimit: 50 },
            { id: 4, lat: 18.6880, lng: 105.6720, type: 'toll', title: 'Trạm thu phí VETC / ePass', speedLimit: 30 },
            { id: 5, lat: 18.6650, lng: 105.6950, type: 'speed', title: 'Khu dân cư đông đúc - Tối đa', speedLimit: 40 }
        ];

        let warningMarkersLayer = L.layerGroup().addTo(map);

        function renderWarningMarkers() {
            warningMarkersLayer.clearLayers();
            warningDatabase.forEach(item => {
                let iconEmoji = '📷';
                if (item.type === 'speed') iconEmoji = '⚡';
                if (item.type === 'toll') iconEmoji = '💰';

                const customIcon = L.divIcon({
                    className: 'custom-warning-marker',
                    html: `<div style="background: rgba(239, 68, 68, 0.9); border: 2px solid white; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.4);">${iconEmoji}</div>`,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });

                const marker = L.marker([item.lat, item.lng], { icon: customIcon });
                marker.bindPopup(`<div style="color: #0f172a; font-weight: bold;">${item.title}</div><div style="font-size: 12px; color: #475569;">Giới hạn: ${item.speedLimit} km/h</div>`);
                warningMarkersLayer.addLayer(marker);
            });
        }
        renderWarningMarkers();

        // 3. Tạo Marker định vị xe với mũi tên xoay hướng
        const userIcon = L.divIcon({
            className: 'user-location-icon',
            html: `<div id="navigation-arrow" class="navigation-arrow"></div>`,
            iconSize: [36, 36],
            iconAnchor: [18, 18]
        });

        let userMarker = null;
        let lastCoords = null;
        let lastTime = null;
        let lastHeading = 0;

        // 4. Định vị GPS thời gian thực & Quét Geofencing cảnh báo
        function startGPSRealtimeTracking() {
            if (!navigator.geolocation) {
                alert("Trình duyệt không hỗ trợ định vị GPS.");
                return;
            }

            const gpsStatusEl = document.getElementById('gps-status');
            const speedEl = document.getElementById('current-speed');
            const speedLimitSign = document.getElementById('speed-limit-sign');
            const alertBanner = document.getElementById('alert-banner');
            const alertText = document.getElementById('alert-text');

            navigator.geolocation.watchPosition(
                (position) => {
                    const { latitude, longitude, speed, heading, accuracy } = position.coords;
                    const currentTime = position.timestamp;
                    const newLatLng = [latitude, longitude];

                    gpsStatusEl.textContent = `GPS Chuẩn (${Math.round(accuracy)}m)`;
                    gpsStatusEl.className = "px-2.5 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full text-[10px] font-semibold";

                    // Tính tốc độ (km/h)
                    let currentSpeedKmh = 0;
                    if (speed !== null && speed >= 0) {
                        currentSpeedKmh = Math.round(speed * 3.6);
                    } else if (lastCoords && lastTime) {
                        const distMeters = calculateDistance(lastCoords[0], lastCoords[1], latitude, longitude);
                        const timeHours = (currentTime - lastTime) / 3600000;
                        if (timeHours > 0) currentSpeedKmh = Math.round((distMeters / 1000) / timeHours);
                    }
                    if (currentSpeedKmh > 160) currentSpeedKmh = 0;
                    speedEl.textContent = currentSpeedKmh;

                    // Tính hướng di chuyển (Heading) để xoay mũi tên Vietmap
                    let currentHeading = heading;
                    if ((currentHeading === null || isNaN(currentHeading)) && lastCoords) {
                        currentHeading = calculateBearing(lastCoords[0], lastCoords[1], latitude, longitude);
                    }
                    if (currentHeading !== null && !isNaN(currentHeading)) {
                        lastHeading = currentHeading;
                    }

                    // Cập nhật hoặc tạo mới Marker trên bản đồ Leaflet
                    if (!userMarker) {
                        userMarker = L.marker(newLatLng, { icon: userIcon }).addTo(map);
                    } else {
                        userMarker.setLatLng(newLatLng);
                    }

                    // Xoay mũi tên theo hướng di chuyển
                    const arrowEl = document.getElementById('navigation-arrow');
                    if (arrowEl) {
                        arrowEl.style.transform = `rotate(${lastHeading}deg)`;
                    }

                    // Tự động dịch chuyển tâm bản đồ theo xe
                    map.setView(newLatLng, map.getZoom(), { animate: true, pan: { duration: 0.8 } });

                    // Quét Geofencing cảnh báo trong bán kính 250m
                    let nearbyWarning = null;
                    warningDatabase.forEach(item => {
                        const dist = calculateDistance(latitude, longitude, item.lat, item.lng);
                        if (dist <= 250) {
                            nearbyWarning = { ...item, distance: Math.round(dist) };
                        }
                    });

                    if (nearbyWarning) {
                        alertBanner.classList.remove('hidden');
                        alertText.textContent = `${nearbyWarning.title} (Cách ${nearbyWarning.distance}m)`;
                        speedLimitSign.classList.remove('hidden');
                        speedLimitSign.textContent = nearbyWarning.speedLimit;

                        // Rung Telegram & Phát giọng nói cảnh báo
                        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
                        speakWarning(`Chú ý, phía trước có ${nearbyWarning.title}`);
                    } else {
                        alertBanner.classList.add('hidden');
                        speedLimitSign.classList.add('hidden');
                    }

                    lastCoords = newLatLng;
                    lastTime = currentTime;
                },
                (error) => {
                    gpsStatusEl.textContent = "Mất tín hiệu GPS";
                    gpsStatusEl.className = "px-2.5 py-1 bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-full text-[10px] font-semibold";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // 5. Hàm phát âm thanh cảnh báo bằng Web Speech API (Tiếng Việt)
        let lastSpokenTime = 0;
        function speakWarning(text) {
            const now = Date.now();
            if (now - lastSpokenTime < 15000) return; // Tránh lặp âm thanh liên tục
            lastSpokenTime = now;

            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'vi-VN';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 6. Tính khoảng cách Haversine (mét) & Hướng Bearing (độ)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function calculateBearing(startLat, startLng, destLat, destLng) {
            const startLatRad = startLat * Math.PI / 180;
            const destLatRad = destLat * Math.PI / 180;
            const dLngRad = (destLng - startLng) * Math.PI / 180;
            const y = Math.sin(dLngRad) * Math.cos(destLatRad);
            const x = Math.cos(startLatRad) * Math.sin(destLatRad) - Math.sin(startLatRad) * Math.cos(destLatRad) * Math.cos(dLngRad);
            let brng = Math.atan2(y, x) * 180 / Math.PI;
            return (brng + 360) % 360;
        }

        // 7. Báo cáo giao thông cộng đồng
        function reportIssue(type) {
            if (!lastCoords) {
                alert("Đang chờ tín hiệu GPS để xác định vị trí báo cáo.");
                return;
            }
            const labels = { camera: 'Phạt nguội', speed: 'Bắn tốc độ', toll: 'Trạm thu phí' };
            if (confirm(`Xác nhận báo cáo điểm ${labels[type]} tại vị trí hiện tại?`)) {
                warningDatabase.push({
                    id: Date.now(),
                    lat: lastCoords[0],
                    lng: lastCoords[1],
                    type: type,
                    title: `Báo cáo mới: ${labels[type]}`,
                    speedLimit: 50
                });
                renderWarningMarkers();
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                alert("Cảm ơn bạn đã đóng góp dữ liệu cộng đồng thành công!");
            }
        }

        // 8. Tìm kiếm địa điểm đơn giản qua OpenStreetMap Nominatim
        async function searchLocation() {
            const query = document.getElementById('search-input').value;
            if (!query) return;

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=vn&limit=1`);
                const data = await res.json();
                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    map.setView([lat, lon], 16);
                    L.marker([lat, lon]).addTo(map).bindPopup(data[0].display_name).openPopup();
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                } else {
                    alert("Không tìm thấy địa điểm này!");
                }
            } catch (err) {
                alert("Lỗi kết nối tìm kiếm địa điểm.");
            }
        }

        // Khởi chạy hệ thống định vị khi tải xong
        window.addEventListener('load', () => {
            startGPSRealtimeTracking();
        });
    </script>
</body>
</html>
